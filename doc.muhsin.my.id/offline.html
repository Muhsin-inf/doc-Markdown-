<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anda Sedang Offline - DocManager</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('doc_theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 dark:bg-zinc-950 dark:text-zinc-100 flex flex-col justify-center items-center p-4 text-center">
    <div class="w-full max-w-sm border border-slate-200 bg-white p-6 sm:p-8 dark:border-zinc-800 dark:bg-zinc-900 shadow-sm">
        <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center border border-slate-300 bg-slate-100 text-slate-600 dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-400">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>
        </div>
        <h1 class="text-lg font-bold text-slate-900 dark:text-zinc-50">Koneksi Terputus</h1>
        <p class="mt-2 text-xs sm:text-sm text-slate-500 dark:text-zinc-400">
            Anda sedang offline. Dokumen atau halaman yang pernah Anda buka sebelumnya mungkin masih tersimpan dalam cache perangkat Anda.
        </p>
        <div class="mt-6 flex flex-col gap-2">
            <button type="button" onclick="window.location.reload()" class="w-full border border-blue-600 bg-blue-600 px-4 py-2 text-xs font-semibold text-white hover:bg-blue-700 dark:border-blue-500 dark:bg-blue-600">
                Coba Muat Ulang
            </button>
            <a href="index.php" class="w-full border border-slate-300 bg-slate-100 px-4 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-200 dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-300">
                Kembali ke Beranda
            </a>
        </div>
    </div>
</body>
</html>
