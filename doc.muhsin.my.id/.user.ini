; .user.ini — Konfigurasi PHP per-direktori
; File ini di-commit ke GitHub agar otomatis ter-deploy ke server via git pull.
; aaPanel (PHP-FPM) membaca file ini secara otomatis dari folder root website.

; ─── Persistent Session (seperti Google Drive) ────────────────────────────────
; File session di server tidak dihapus sebelum 30 hari tidak aktif
session.gc_maxlifetime = 2592000

; Cookie session di browser hidup 1 tahun (rolling: diperpanjang tiap request)
session.cookie_lifetime = 31536000

; Keamanan: cookie tidak bisa dibaca JavaScript
session.cookie_httponly = 1

; SameSite Lax — aman terhadap CSRF, kompatibel redirect OAuth Google
session.cookie_samesite = Lax
